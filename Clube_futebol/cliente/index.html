<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clube de futebol</title>
</head>
<body>
    <center>
        <h1>Nova Consulta</h1>
        <form action="http://localhost:3000" method="post">
            <input type="number" placeholder="Identificação" name="id" required>
            <br><br>
            <input type="text" placeholder="nome do clube" name="nome" required>
            <br><br>
            <input type="date" placeholder="vitorias" name="vitorias" required>
            <br><br>
            <input type="number" placeholder="empates" name="empate" required>
            <br><br>
            <input type="number" placeholder="derrotas" name="derrota" required>
            <br><br>

            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
           
        </form>
    </center>
</body>
</html>
