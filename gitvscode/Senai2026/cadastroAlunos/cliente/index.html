<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
</head>
<body>
    <center>
        <h1>Alunos</h1>
        <form action="http://localhost:3000" method="post">
            <input type="number" placeholder="Identificação" name="id" required>
            <br><br>
            <input type="text" placeholder="nome" name="nome" required>
            <br><br>
            <input type="number" step="0.01" placeholder="nota1" name="notaum" required>
            <br><br>
            <input type="number" step="0.01" placeholder="nota2" name="notadois" required>
            <br><br>
            <input type="number" step="0.01" placeholder="nota3" name="notatres" required>
            <br><br>

            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
           
        </form>
    </center>
</body>
</html>
