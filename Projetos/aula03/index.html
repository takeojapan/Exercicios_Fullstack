<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="pt-BR">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Deixe um Comentário</h1>

    <label for="nome">Nome: </label><br>
     <input type="text" id="nome" required>
<br>
    <label for="email">Email:</label><br>
     <input type="email" id="email" required>
<br>
    <label for="website">Website: </label><br>
     <input type="text" id="website" required>
<br>
    <label for="comentario">Comentário: </label><br>
     <textarea ="comentario"></textarea>
    <h4>Observação: Seu comentário será publicado após passar pelo moderador</h4>
     <input type="submit">
<br>
    <h1>Manutenção de usuários do sistema interno</h1>
<br>
    <label for="login">Login </label>
     <input type="email" id="login" required><br>
    <label for="senha">Senha </label>
     <input type="password" id="senha" required><br>
    <label for="status">Status </label>
     <select id="status">
        <option>ativo</option>
        <option>inativo</option>
    </select><br>
    <label for="tipo">Tipo</label>
     <input type="radio" id="tipo" required>
    <label for="tipo">Técnico</label>
     <input type="radio" id="tipo" required>
    <label for="tipo">Professor</label>
     <input type="radio" id="tipo" required>
    <label for="tipo">Aluno</label><br>
     <label for="datac">Data Criação</label>
    <input type="date" id="datac" required><br>
     <label for="perfil">Perfil</label>
    <input type="radio" id="perfil" required>
     <label for="perfil">Convidado</label>
    <input type="radio" id="perfil" required>
     <label for="perfil">Administrador</label><br>
    <label for="Observ">Observações</label>
     <textarea ="Observ"></textarea>
<br>
    <label for="modu">Módulos</label>
    <input type="checkbox" id="modu" name="Compras">
     <label for="modu">Compras</label>
    <input type="checkbox" id="modu" name="Biblioteca">
     <label for="modu">Biblioteca</label>
    <input type="checkbox" id="modu" name="Acadêmica">
     <label for="modu">Acadêmica</label><br>
    <input type="checkbox" id="modu" name="Documentação">
     <label for="modu">Documentação</label>
    <input type="checkbox" id="modu" name="Recursos humanos">
     <label for="modu">Recursos humanos</label>
<br>
    <h1>Formulário</h1>
<br>
    <fieldset>
        <legend>Dados Pessoais</legend>
         <label for="nome">Nome</label>
        <input type="name" id="nome" required><br>
         <label for="Endereço">Endereço</label>
        <input type="text" id="Endereço" required><br>
         <label for="Cidade">Cidade</label>
        <input type="text" id="Cidade" required><br>
         <label for="Estado">Estado</label>
        <select id="Estado">
            <option>São Paulo</option>
            <option>Curitiba</option>
            <option>Guarujá</option>
        </select>
    </fieldset>

    <fieldset>
        <legend>Dados Profissionais</legend>
         <label for="NTC">Natureza do Cargo</label><br>
        <input type="radio" id="NTC" name="Gerência">
         <label for="NTC">Gerência</label>
        <input type="radio" id="NTC" name="Financeiro">
         <label for="NTC">Financeiro</label>
        <input type="radio" id="NTC" name="Recepção">
         <label for="NTC">Recepção</label>
        <input type="radio" id="NTC" name="Administrativo">
         <label for="NTC">Administrativo</label>
        <input type="radio" id="NTC" name="Jurídico">
         <label for="NTC">Jurídico</label>
<br>
<br>
        <label for="ARD">Àrea de interesse</label><br>
         <input type="checkbox" id="ARD" name="Computação">
        <label for="ARD">Computação</label>
         <input type="checkbox" id="ARD" name="Biologia">
        <label for="ARD">Biologia</label>
         <input type="checkbox" id="ARD" name="Meio Ambiente">
        <label for="ARD">Meio Ambiente</label>
         <input type="checkbox" id="ARD" name="Engenharia">
        <label for="ARD">Engenharia</label>
         <input type="checkbox" id="ARD" name="História">
        <label for="ARD">História</label>
<br>
        <label for="MNC">Mini Currículo</label>
         <textarea ="MNC"></textarea>
    </fieldset>

        <input type="submit">
         <input type="reset" value="limpar">
</body>
</html>
